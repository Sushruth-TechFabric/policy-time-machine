name: diagrams

on:
  push:
    paths: ["docs/**", "ci/render-diagrams.sh", ".github/workflows/render-diagrams.yml"]
  pull_request:
    paths: ["docs/**", "ci/render-diagrams.sh", ".github/workflows/render-diagrams.yml"]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Render every Mermaid diagram (a render failure fails the build)
        run: bash ci/render-diagrams.sh
