bundle:
  name: policy_time_machine

variables:
  app_service_principal_id:
    description: Application id of the policy-time-machine app's service principal (Apps UI > app > Authorization).
    default: "5ee081ba-a745-4666-8ad2-41d3cfc674db"
  review_model_endpoint:
    description: >-
      Pay-per-token chat endpoint enabled on this workspace's serving page. The
      design named databricks-claude-*; this Free Edition workspace exposes no
      Claude endpoints (checked 2026-09-17), so the default is the strongest
      pay-per-token model that is present. The harness is model-agnostic (one
      JSON object per turn).
    default: "databricks-gpt-oss-120b"

# Task zero: deploy-envelope smoke test only. Keep node_modules and
# frontend source noise out of the upload — Databricks Apps enforces
# a 10 MB per-file limit and only the built static bundle is needed
# at runtime (ADR-0012).
sync:
  # Vite's scaffolded app/frontend/.gitignore excludes "dist" — bundle
  # sync honours .gitignore even in a non-git directory, so the build
  # output must be force-included or it silently never uploads.
  include:
    - app/frontend/dist/**
  exclude:
    - app/frontend/node_modules/**
    - app/frontend/src/**
    - app/frontend/public/**
    - app/frontend/*.md
    - app/frontend/.gitignore
    - app/frontend/index.html
    - app/frontend/vite.config.js
    - app/frontend/.oxlintrc.json
    - app/frontend/package*.json
    # Workspace files are visible to anyone with workspace access; only the
    # runtime set belongs there. Everything below is local tooling, docs, or
    # tests with no deployed resource referencing it.
    - demo/**
    # docs/ is excluded piecewise so docs/diagrams/ (the architecture story,
    # source + rendered SVG) stays visible in the workspace.
    - docs/adr/**
    - docs/specs/**
    - docs/superpowers/**
    - docs/genie-curation.md
    - ci/**
    - genie/**
    - .github/**
    - CONTEXT.md
    - app/backend/tests/**
    - pipeline/tests/**
    - pipeline/uc_comments.py
    - pipeline/pytest.ini
    - pipeline/requirements-dev.txt
    - generator/tests/**
    - "**/.gitignore"

resources:
  apps:
    policy_time_machine_app:
      name: policy-time-machine
      description: "Policy Time Machine — investigation workbench and claim review"
      source_code_path: ./app
      user_api_scopes:
        - dashboards.genie
        - sql
      resources:
        - name: postgres
          postgres:
            branch: ${resources.postgres_branches.ptm_production.name}
            database: ${resources.postgres_databases.ptm_review_db.name}
            permission: CAN_CONNECT_AND_CREATE
      # Deploy-time app config. When `config` is set here it replaces
      # app/app.yaml, which stays as the local/standalone twin; keep both in
      # step. Interpolation is the reason it lives here: the dev target
      # prefixes the experiment name and the model endpoint is a variable.
      config:
        command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "$DATABRICKS_APP_PORT"]
        env:
          - name: GENIE_SPACE_ID
            value: "01f1a5808edd1859b78359723b7c5379"
          - name: DATABRICKS_WAREHOUSE_ID
            value: "e39eb96b7df5ab0f"
          - name: PTM_CATALOG
            value: "workspace"
          - name: PTM_SCHEMA
            value: "ptm_gold"
          - name: LAKEBASE_PROJECT_ID
            value: "policy-time-machine"
          - name: APP_SERVICE_PRINCIPAL_ID
            value: ${var.app_service_principal_id}
          - name: REVIEW_MODEL_ENDPOINT
            value: ${var.review_model_endpoint}
          - name: REVIEW_MLFLOW_EXPERIMENT
            value: ${resources.experiments.ptm_review_traces.name}
          - name: REVIEW_DEMO_HOLD_SECONDS
            value: "0"

  postgres_projects:
    ptm_review:
      project_id: policy-time-machine
      display_name: Policy Time Machine review record
      pg_version: 17
      permissions:
        - level: CAN_MANAGE
          service_principal_name: ${var.app_service_principal_id}

  postgres_branches:
    ptm_production:
      parent: ${resources.postgres_projects.ptm_review.id}
      branch_id: production
      replace_existing: true
      no_expiry: true

  postgres_endpoints:
    ptm_primary:
      parent: ${resources.postgres_branches.ptm_production.id}
      endpoint_id: primary
      # The default branch is born with a read-write endpoint named primary;
      # take it over instead of failing on ALREADY_EXISTS.
      replace_existing: true
      endpoint_type: ENDPOINT_TYPE_READ_WRITE
      autoscaling_limit_min_cu: 0.5
      autoscaling_limit_max_cu: 1

  # The app service principal owns the review database. The deploying user
  # created the project and therefore holds the Lakebase superuser role, so
  # the Workflow's run-as identity needs no role of its own.
  postgres_roles:
    ptm_app_role:
      parent: ${resources.postgres_branches.ptm_production.id}
      role_id: app-service-principal
      postgres_role: ${var.app_service_principal_id}
      identity_type: SERVICE_PRINCIPAL
      replace_existing: true

  postgres_databases:
    ptm_review_db:
      parent: ${resources.postgres_branches.ptm_production.id}
      database_id: review
      postgres_database: review
      role: ${resources.postgres_roles.ptm_app_role.name}

  experiments:
    ptm_review_traces:
      name: /Shared/policy-time-machine-review
      permissions:
        - level: CAN_EDIT
          service_principal_name: ${var.app_service_principal_id}

  pipelines:
    policy_time_machine_pipeline:
      name: policy_time_machine_pipeline
      catalog: workspace
      # `schema` (not `target`) opts into direct publishing mode: unqualified
      # @dlt.table names publish to ptm_gold, while the silver change_event
      # table publishes cross-schema under its fully qualified name
      # (medallion layout, ADR-0016).
      schema: ptm_gold
      serverless: true
      channel: PREVIEW
      configuration:
        ptm.catalog: workspace
        ptm.bronze_schema: ptm_bronze
        ptm.silver_schema: ptm_silver
        # ptm.anchor_date deliberately unset (P8): dlt_pipeline.py falls back
        # to reading generation_manifest.anchor_date, so the pipeline always
        # checks the anchor the source tables were actually built at rather
        # than a value that would drift out of sync after every scheduled
        # regeneration.
        ptm.k: "20"
      libraries:
        - file:
            path: pipeline/dlt_pipeline.py
        - file:
            path: pipeline/transformations.py
        - file:
            path: pipeline/expectations.py

  jobs:
    # P8 — the scheduled regeneration Workflow. generate -> validate ->
    # load_source_tables -> refresh_pipeline. Free Edition is serverless-only,
    # so every task below omits new_cluster/existing_cluster_id: tasks 1, 2
    # and 3 run on serverless Python compute (environment_key required for
    # non-notebook serverless tasks) and task 4 triggers the existing
    # serverless DLT pipeline.
    policy_time_machine_regeneration:
      name: policy_time_machine_regeneration
      description: >-
        Regenerates the synthetic dataset at today's UTC date, validates its
        declared effect sizes, reloads the nine bronze Delta tables
        (ptm_bronze), and full-refreshes the DLT pipeline into ptm_silver and
        ptm_gold. Keeps the dataset inside the
        guaranteed-activity tail (anchor-120d, ADR-0006/spec 08 section 2)
        for judging that happens with no deploy in between.
      environments:
        - environment_key: generator_env
          spec:
            # Environment version 5: Python 3.12, pyarrow 21.0.0 (generator
            # needs pyarrow>=15) — fine as preinstalled. pandas is pinned up
            # from the preinstalled 2.2.3: that version's pd.to_datetime(...,
            # errors="coerce") defaults to nanosecond resolution and silently
            # overflows the SCD2 open-ended sentinel (9999-12-31,
            # generator/constants.py FAR_FUTURE) to NaT before the later
            # .astype("datetime64[s]") cast in generator/validate.py:load()
            # ever runs — verified by reproducing generator.validate's S6
            # utilisation check failing under pandas==2.2.3 and passing again
            # under pandas>=3.0 with pyarrow/numpy held fixed. generator/ is
            # out of scope to edit here, so the fix lives in the environment.
            environment_version: "5"
            dependencies:
              - "pandas>=3.0,<4"
              - "databricks-sdk>=0.89,<1"
              - "psycopg[binary]>=3.2,<3.3"  # 3.3 hangs in libpq init on serverless (2026-09-17)
              - "mlflow>=3.1,<4"
      tasks:
        - task_key: generate
          environment_key: generator_env
          spark_python_task:
            python_file: workflow/generate_task.py
            # ${workspace.file_path} is the bundle's deployed "files" root in
            # the workspace. Passed explicitly because a serverless
            # spark_python_task does not set __file__ in the executed
            # module's globals, so the script can't derive its own location
            # (see generate_task.py's docstring).
            parameters: ["--bundle-root", "${workspace.file_path}"]
        - task_key: validate
          depends_on:
            - task_key: generate
          environment_key: generator_env
          spark_python_task:
            python_file: workflow/validate_task.py
            parameters: ["--bundle-root", "${workspace.file_path}"]
        - task_key: load_source_tables
          depends_on:
            - task_key: validate
          environment_key: generator_env
          spark_python_task:
            python_file: workflow/load_source_tables.py
        - task_key: refresh_pipeline
          depends_on:
            - task_key: load_source_tables
          pipeline_task:
            pipeline_id: ${resources.pipelines.policy_time_machine_pipeline.id}
            full_refresh: true
        - task_key: route_claims
          depends_on:
            - task_key: refresh_pipeline
          environment_key: generator_env
          spark_python_task:
            python_file: workflow/route_claims_task.py
            parameters:
              - "--bundle-root"
              - "${workspace.file_path}"
              - "--LAKEBASE_PROJECT_ID"
              - "policy-time-machine"
              - "--APP_SERVICE_PRINCIPAL_ID"
              - "${var.app_service_principal_id}"
              - "--REVIEW_MODEL_ENDPOINT"
              - "${var.review_model_endpoint}"
              - "--REVIEW_MLFLOW_EXPERIMENT"
              - "${resources.experiments.ptm_review_traces.name}"
        - task_key: build_briefs
          depends_on:
            - task_key: route_claims
          environment_key: generator_env
          spark_python_task:
            python_file: workflow/build_briefs_task.py
            parameters:
              - "--bundle-root"
              - "${workspace.file_path}"
              - "--LAKEBASE_PROJECT_ID"
              - "policy-time-machine"
              - "--APP_SERVICE_PRINCIPAL_ID"
              - "${var.app_service_principal_id}"
              - "--REVIEW_MODEL_ENDPOINT"
              - "${var.review_model_endpoint}"
              - "--REVIEW_MLFLOW_EXPERIMENT"
              - "${resources.experiments.ptm_review_traces.name}"
      schedule:
        # Daily is far inside the staleness budget: the guaranteed-activity
        # tail covers anchor-120d (spec 01 section 5.4 / spec 08 section 2),
        # so a judge running the demo any day after a missed run still has
        # up to ~119 days of slack before the tail's outer bucket runs dry.
        quartz_cron_expression: "0 0 9 * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED
      max_concurrent_runs: 1

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-1edff070-fbb9.cloud.databricks.com
